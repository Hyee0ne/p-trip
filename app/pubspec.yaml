name: p_trip
description: "P의 여행 — 국도 위의 우연한 발견을 설계하는 발견 레이더."
publish_to: 'none'
version: 1.0.2+7

environment:
  # ⚠ 로컬 Dart 3.11.5 기준. flutter_riverpod 3.4+ / go_router 18+ 는 Dart 3.12 요구.
  #   Flutter를 올리면 아래 pin을 풀 것 (CLAUDE.md 기술 스택 참조).
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태관리 · 라우팅
  flutter_riverpod: 3.3.2      # pinned: 3.4+ 는 Dart 3.12 필요
  go_router: 17.5.0            # pinned: 18+ 는 Dart 3.12 필요

  # 백엔드
  supabase_flutter: ^2.17.2

  # 위치 · 지도 · 내비
  geolocator: ^14.0.3

  # 여행기
  photo_manager: ^3.12.0
  share_plus: ^13.3.0

  # 레이더 보조
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^19.0.0   # DR-06 백그라운드 근접 알림

  # 유틸
  intl: ^0.20.2
  url_launcher: ^6.3.1
  apple_maps_flutter: ^1.4.0   # 홈 지도 — Apple MapKit (카카오맵 → 2026-09-09 교체, 키 불필요)
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # ⚠ 더미 사진 — 화면 검토용. M1에서 TourAPI 관광사진으로 교체한다.
    #   출처 Lorem Picsum(Unsplash 라이선스). 제출물에는 실데이터 사진을 쓴다.
    - assets/images/

  # Pretendard — 앱 전체 단일 서체 (CLAUDE.md 서체 규칙).
  # 이동 중 화면도 여행기도 전부 이 고딕 하나. 명조 안 씀.
  # SIL OFL 1.1 · assets/fonts/OFL.txt 동봉
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
