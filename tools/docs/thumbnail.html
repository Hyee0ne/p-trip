<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(../../app/assets/fonts/Pretendard-ExtraBold.otf);font-weight:800}
@font-face{font-family:P;src:url(../../app/assets/fonts/Pretendard-Bold.otf);font-weight:700}
@font-face{font-family:P;src:url(../../app/assets/fonts/Pretendard-SemiBold.otf);font-weight:600}
@font-face{font-family:P;src:url(../../app/assets/fonts/Pretendard-Regular.otf);font-weight:400}
html,body{margin:0;background:#888}
.card{position:relative;width:1600px;height:900px;overflow:hidden;font-family:P,'Apple SD Gothic Neo',sans-serif;color:#15201F;
  background:#F4F5F1;
  background-image:linear-gradient(rgba(21,32,31,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(21,32,31,.045) 1px,transparent 1px);
  background-size:44px 44px}
.card.dark{background:#0D1117;color:#F0EDE6;background-image:linear-gradient(rgba(240,237,230,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(240,237,230,.05) 1px,transparent 1px)}
.roadwrap{position:absolute;left:-60px;top:553px;width:1720px;height:26px;transform:rotate(-7deg)}
.roadwrap .under{position:absolute;inset:0;background:#fff;border-radius:13px;box-shadow:0 3px 12px rgba(21,32,31,.22)}
.dark .roadwrap .under{background:#243244;box-shadow:none}
.roadwrap .line{position:absolute;left:0;right:0;top:7px;height:12px;background:#1D4ED8;border-radius:6px}
.tick{position:absolute;width:3px;height:26px;background:#fff;border-radius:2px;transform:rotate(-7deg)}
.icon{position:absolute;left:190px;top:285px;width:330px;height:330px;border-radius:74px;box-shadow:0 30px 60px rgba(21,32,31,.18);object-fit:cover}
.title{font-size:132px;font-weight:800;letter-spacing:-5px;line-height:1;white-space:nowrap}
.title .sub{color:#1D4ED8}
.title .colon{color:#9AA7A8;font-weight:600;margin:0 14px}
.tag{padding-left:6px;font-size:40px;font-weight:600;color:#5E6E70;letter-spacing:-.5px}
.dark .tag{color:#B4ADA2}
.badge{position:absolute;left:566px;top:640px;display:flex;align-items:center;gap:18px;font-size:30px;font-weight:600;color:#5E6E70}
.dark .badge{color:#B4ADA2}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:92px;height:62px;padding:0 24px;border-radius:999px;background:#1D4ED8;color:#fff;font-weight:800;font-size:34px;letter-spacing:-1px;border:4px solid #fff;box-shadow:0 6px 16px rgba(29,78,216,.28)}
.dark .pill{border-color:#0D1117}
.sun{position:absolute;right:90px;top:80px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFD79A,#E8A13D 60%,rgba(232,161,61,0) 62%);opacity:.9}
.text{position:absolute;left:600px;top:285px;height:330px;display:flex;flex-direction:column;justify-content:center;gap:30px}
</style>
<div class="card" id="a">
  <img class="icon" src="../../app/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png">
  <div class="text">
    <div class="title">P의 여행<span class="colon">:</span><span class="sub">국도편</span></div>
    <div class="tag">지나치기엔 아까운 것들이, 길마다 있어요.</div>
  </div>
</div>
<!--
  썸네일 소스 (2026-09-16). 저장소 루트에서 `python3 -m http.server 8766` 을 띄우고
  http://localhost:8766/tools/docs/thumbnail.html 을 열어 #a 를 1600×900 으로 캡처한다.
  결과: docs/썸네일/썸네일_밝음.png — 기능설명서 4번 슬라이드 대표 이미지.
  아이콘 + 이름 + 카피만. 글 블록은 아이콘 높이(285~615) 안에서 세로 가운데(flex).
